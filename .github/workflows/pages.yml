name: Deploy entropy-sim web apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "chained-surprisal-distributions/web/**"
      - "online-updated-surprisal-distribution/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r chained-surprisal-distributions/web/. _site/
          cp -r online-updated-surprisal-distribution _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
