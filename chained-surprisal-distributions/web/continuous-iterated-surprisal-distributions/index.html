<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entropy &amp; Surprisal Explorer — Continuous</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #1a1a2e;
    color: #ccc;
    padding: 10px 14px 40px;
  }

  h1 {
    color: #fff;
    font-size: 1.25rem;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .panel {
    background: #16213e;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .row:last-child { margin-bottom: 0; }

  label.field {
    display: flex;
    flex-direction: column;
    font-size: 0.72rem;
    color: #9aa0c0;
    gap: 2px;
  }

  label.field input[type="range"] {
    width: 220px;
    accent-color: #e94560;
  }

  label.field .val { color: #fff; font-weight: 600; }

  select, input[type="text"], input[type="number"] {
    background: #0a0f1e;
    border: 1px solid #333;
    border-radius: 4px;
    color: #fff;
    padding: 5px 7px;
    font-size: 0.8rem;
  }

  select:focus, input:focus { outline: none; border-color: #e94560; }

  button {
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 7px 14px;
    color: #fff;
    background: #0f3460;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: #e94560; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.success { background: #1e824c; }
  button.success:hover:not(:disabled) { background: #28a86a; }
  button.warning { background: #8a5a00; }
  button.warning:hover:not(:disabled) { background: #c07d00; }
  button.primary { background: #533483; }
  button.primary:hover:not(:disabled) { background: #7245b5; }
  button.toggle-group { background: #0a0f1e; border: 1px solid #333; }
  button.toggle-group.active { background: #0f3460; border-color: #e94560; }
  button.small { padding: 4px 9px; font-size: 0.75rem; }

  .checkbox-row { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; }
  .checkbox-row input { accent-color: #e94560; }

  .status-text { font-size: 0.75rem; color: #e94560; min-width: 160px; }

  #trace-summary { font-size: 0.78rem; line-height: 1.8; padding: 2px 0; }

  #transport-label { font-size: 0.78rem; color: #9aa0c0; white-space: nowrap; }

  #history-slider { flex: 1; accent-color: #e94560; }

  #busy-indicator {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 9999; background: #3a2a0a; border: 1px solid #b45309;
    border-radius: 6px; padding: 6px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    color: #f5a623; font-weight: bold; font-size: 14px; display: none;
  }

  #node-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .node-panel {
    background: #16213e;
    border-radius: 8px;
    padding: 10px 12px;
  }

  .node-figure-row { display: flex; gap: 14px; align-items: flex-start; }

  .node-canvas-wrap { position: relative; }

  canvas.density-canvas {
    background: #0a0f1e;
    border-radius: 4px;
    cursor: grab;
  }
  canvas.density-canvas:active { cursor: grabbing; }

  .canvas-reset-btn {
    position: absolute; top: 6px; right: 6px;
    background: rgba(10,15,30,0.85); border: 1px solid #444; color: #ccc;
    border-radius: 4px; width: 22px; height: 22px; font-size: 13px;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .canvas-reset-btn:hover { background: #e94560; }

  .hover-tip {
    position: absolute; pointer-events: none; display: none;
    background: rgba(10,15,30,0.95); border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font-size: 0.72rem; color: #fff; white-space: nowrap;
  }

  .bin-width-panel { width: 230px; }

  .kl-display { font-size: 0.78rem; line-height: 1.8; margin-left: 4px; }
  .kl-display a { color: #7ab7ff; text-decoration: none; }
  .kl-display a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>Entropy &amp; Surprisal Explorer — Continuous</h1>
<div id="busy-indicator">⏳ Working…</div>

<div class="panel" id="top-controls"></div>
<div class="panel" id="transport-panel"></div>
<div id="trace-summary"></div>
<div class="row" id="initial-derive-row" style="margin:10px 0;"></div>

<div id="node-grid"></div>

<script src="app.js"></script>
</body>
</html>
